<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ParkSmart | Book a slot</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="mark">P</span>ParkSmart</a><nav><a href="index.html">Dashboard</a><a href="slots.html">Slots</a><a class="active" href="booking.html">Book Slot</a><a href="bookings.html">Bookings</a><a href="checkin.html">Check-In</a><a href="checkout.html">Check-Out</a></nav></header><main class="shell"><div class="heading"><div><p class="eyebrow">RESERVATION</p><h1>Book a parking slot.</h1><p class="subtle">Your time window is checked against every active reservation.</p></div></div><div id="booking-message" class="message"></div><form id="booking-form" class="panel form-grid"><label>User name<input required name="userName" placeholder="Alex Morgan"></label><label>Vehicle number<input required name="vehicleNumber" placeholder="TN01AB1234"></label><label>Parking lot<select required id="parking-lot-id"></select></label><label>Parking slot<select required name="slotId" id="slot-id"></select></label><label>Start time<input required name="startTime" type="datetime-local"></label><label>End time<input required name="endTime" type="datetime-local"></label><div class="actions"><button class="button" type="submit">Confirm booking</button><a class="button secondary" href="slots.html">Find a slot</a></div></form></main><script src="js/app.js"></script><script src="js/booking.js"></script></body></html>
